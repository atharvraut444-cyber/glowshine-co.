<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlowShine Co. — Beauty That Learns What You Love</title>
    <meta
      name="description"
      content="GlowShine Co. is an intelligent beauty e-commerce store offering personalized skincare, cosmetics, and routine discovery powered by behavioral intelligence."
    />
    <meta name="keywords" content="beauty, skincare, cosmetics, personalized skincare, routine discovery, GlowShine, beauty intelligence" />
    <meta name="theme-color" content="#F7F4EF" />

    <!-- Preconnect & DNS Prefetch to Critical Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Preload Hero LCP Image for Rapid First Impression -->
    <link
      rel="preload"
      as="image"
      href="/products/hero-formulation.jpg"
      fetchpriority="high"
    />

    <!-- Non-render-blocking Google Fonts: Inter, Manrope & DM Serif Display -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  </head>
  <body class="bg-ivory text-ink font-sans antialiased selection:bg-rose-clay selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
